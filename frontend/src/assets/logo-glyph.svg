<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="MitM">
  <!-- Компактный вариант знака: только ладонь с буквой M. Потоки слева и справа
       в 16–22 пикселях всё равно сливаются в кашу, поэтому для шапки окна, иконки
       exe и трея берётся эта версия — узнаваемое ядро логотипа без мелочи. -->
  <defs>
    <linearGradient id="mitmGlyphHand" gradientUnits="userSpaceOnUse" x1="20" y1="24" x2="91" y2="106">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#7C4DEF"/>
    </linearGradient>
  </defs>
  <g transform="translate(-6.17 -15.4) scale(0.976)">
    <g fill="url(#mitmGlyphHand)">
      <rect x="40" y="36" width="10" height="46" rx="5" opacity=".78"/>
      <rect x="53" y="24" width="10" height="58" rx="5"/>
      <rect x="66" y="27" width="10" height="55" rx="5" opacity=".9"/>
      <rect x="79" y="38" width="10" height="44" rx="5" opacity=".72"/>
      <path d="M38 62h53v24a20 20 0 0 1-20 20H58a20 20 0 0 1-20-20z"/>
      <path d="M50 94L27 80" fill="none" stroke="url(#mitmGlyphHand)" stroke-width="14" stroke-linecap="round"/>
    </g>
    <g fill="none" stroke="#F5F3FF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
      <path d="M51 97V73l13 17 13-17v24"/>
    </g>
  </g>
</svg>
